AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Exclude:
    - 'vendor/**/*'
    - 'Gemfile.lock'

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 30

Metrics/ClassLength:
  Max: 250

Metrics/AbcSize:
  Max: 40

Style/ClassVars:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Style/SingleLineMethods:
  Enabled: false

Layout/LineLength:
  Max: 120
